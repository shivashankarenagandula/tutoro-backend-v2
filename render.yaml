# Render deploy config. Push this repo to GitHub, then in Render:
# New -> Blueprint -> connect this repo -> Render reads this file automatically.
#
# NOTE: This does NOT provision a database. Use Aiven's free PostgreSQL
# instead (permanent, no expiry) and paste its connection string into
# DATABASE_URL manually in Render's dashboard after first deploy.
# Render's own free Postgres add-on expires after 30 days -- avoid it.
#
# NOTE: Free tier has no Shell/SSH access, so `create_admin` (a custom,
# idempotent management command) creates your admin login automatically
# on every deploy from ADMIN_EMAIL / ADMIN_PHONE / ADMIN_PASSWORD below
# -- set those three in Render's dashboard, no shell needed.

services:
  - type: web
    name: tutoro-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate && python manage.py loaddata mvp_seed_data && python manage.py create_admin && gunicorn config.wsgi"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        sync: false   # set manually to your Aiven connection string
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # set manually to your GitHub Pages URL
      - key: ADMIN_EMAIL
        sync: false   # set manually -- your admin login email
      - key: ADMIN_PHONE
        sync: false   # set manually -- your admin login phone
      - key: ADMIN_PASSWORD
        sync: false   # set manually -- your admin login password
      - key: GEMINI_API_KEY
        sync: false   # set manually -- used by apps.ai for smart matching, bio generation, etc.
      # ---------------------------------------------------------------
      # EMAIL (SMTP) -- required for password-reset codes and email
      # verification OTPs to actually send. Without these, EMAIL_HOST_USER
      # is empty, send_mail() raises, and the API silently swallows the
      # failure (by design, to avoid leaking which emails are registered)
      # -- so signup/login/reset all still "succeed" but no email ever
      # arrives. This is almost certainly why reset codes aren't showing
      # up: these were never set.
      #
      # For Gmail: use an App Password (myaccount.google.com/apppasswords),
      # NOT your normal Gmail password -- Gmail rejects SMTP login with
      # the account password directly. Any other SMTP provider (SendGrid,
      # Mailgun, Amazon SES, your domain host, etc.) works too -- just
      # change EMAIL_HOST/EMAIL_PORT to match.
      # ---------------------------------------------------------------
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false   # set manually -- the sending mailbox address, e.g. yourteam@gmail.com
      - key: EMAIL_HOST_PASSWORD
        sync: false   # set manually -- Gmail App Password (or your SMTP provider's password/API key)
      - key: DEFAULT_FROM_EMAIL
        sync: false   # optional -- defaults to EMAIL_HOST_USER if unset
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false   # optional -- defaults to EMAIL_HOST_USER if unset
